name: Publish Dev release
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a85c064cf97dfc22a7ff41049f02ded281841a66
          persist-credentials: false
      - name: Read-only publisher diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{full_name,private,permissions}'
          python tools/publish_github.py --repo "$GITHUB_REPOSITORY" --require-ci --check-only
