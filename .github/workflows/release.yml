name: Publish Dev release
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-dev
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'krazydarky-code/Multi-Script' &&
      (vars.MS_AUTOPUBLISH == 'true' || github.event_name == 'workflow_dispatch') &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install publisher dependency
        run: python -m pip install cryptography
      - name: Inspect tested version without loading a signing key
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,sys
          result=subprocess.run([sys.executable,'tools/publish_github.py','--repo',os.environ['GITHUB_REPOSITORY'],'--require-ci','--check-only'],capture_output=True,text=True)
          if result.returncode:
              sys.stderr.write(result.stderr)
              raise SystemExit(result.returncode)
          data=json.loads(result.stdout)
          print(result.stdout)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('publish='+str(data['publish']).lower()+'\n')
          PY
      - name: Materialize private signing key outside checkout
        if: steps.plan.outputs.publish == 'true'
        env:
          MS_SIGNING_KEY: ${{ secrets.MS_UPDATE_SIGNING_KEY }}
        run: |
          python - <<'PY'
          import os,pathlib
          value=os.environ.get('MS_SIGNING_KEY','')
          if not value: raise SystemExit('MS_UPDATE_SIGNING_KEY is missing; no release was published')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'multi-script-release.pem'
          path.write_text(value,encoding='utf-8')
          path.chmod(0o600)
          PY
      - name: Build, sign, verify draft assets and publish
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_github.py --repo "$GITHUB_REPOSITORY" --key "$RUNNER_TEMP/multi-script-release.pem" --require-ci
      - name: Remove private key
        if: always()
        run: python -c "import os,pathlib; (pathlib.Path(os.environ['RUNNER_TEMP'])/'multi-script-release.pem').unlink(missing_ok=True)"
