name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install websockets cryptography Pillow lupa
          npm install --no-save playwright@1.63.0 prosemirror-view@1.42.8 prosemirror-state@1.4.4 prosemirror-schema-basic@1.2.5 esbuild@0.25.12
          npx playwright install --with-deps chromium
          python tools/prepare_luau.py
          node -e "const fs=require('fs');const file=process.env.RUNNER_TEMP+'/native-editor.js';require('esbuild').buildSync({entryPoints:['tests/support/native-prosemirror.mjs'],bundle:true,format:'iife',outfile:file});fs.appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_PATH='+require('playwright').chromium.executablePath()+'\nMS_NATIVE_EDITOR_BUNDLE='+file+'\n')"
      - name: Release integrity and syntax
        run: python tools/release_check.py
      - name: Required provider, updater, skill and UI checks
        run: python tools/run_ci_shard.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-verification-${{ matrix.shard }}
          path: test-results/ci
          retention-days: 14
  verification-receipt:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect verified shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for shard in 0 1 2 3; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "ci-verification-$shard" --dir "test-results/shard-$shard"
          done
          python tools/merge_ci_receipts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-verification
          path: test-results/ci
          retention-days: 14
  blender-workspace-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare real Blender and browser
        shell: pwsh
        run: |
          python -m pip install websockets cryptography Pillow
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
          python tools/prepare_luau.py
          node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_PATH='+require('playwright').chromium.executablePath()+'\n')"
          $env:MS_BLENDER_CACHE = Join-Path $env:RUNNER_TEMP 'multi-script-blender-cache'
          Add-Content -Path $env:GITHUB_ENV -Value "MS_BLENDER_CACHE=$env:MS_BLENDER_CACHE"
          python -c "import sys; sys.path.insert(0,'runtime'); import blender_portable; print(blender_portable.prepare())"
      - name: Real Blender and browser roundtrips
        run: python tools/verify.py all test_blender_workspace_real_6490.py test_blender_workspace_browser_6490.js test_blender_companion_real_6492.py test_blender_preview_persistence_6492.py test_blender_target_routing_6496.py test_blender_connection_faults_6497.py test_blender_owner_lifecycle_6497.py test_omni_gui_650.py --output test-results/blender-workspace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blender-workspace-real-windows
          path: test-results/blender-workspace
          retention-days: 14
